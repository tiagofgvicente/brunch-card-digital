<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunch VIP - POC</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --bg: #f4f1ea; --dark: #333; --gold: #ffd166; }
        body { background: #222; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: white; }

        .demo-badge { background: #ff4444; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 20px; text-transform: uppercase; }

        /* Card Container & Flip Logic */
        .card-wrapper { width: 340px; height: 210px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid rgba(255,255,255,0.1); }

        /* FRONT FACE */
        .card-front { background: var(--primary); color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .brand { font-weight: 900; font-size: 1.4rem; letter-spacing: -1px; }
        .promo-tag { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; }

        .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 15px 0; }
        .circle { width: 42px; height: 42px; background: rgba(0,0,0,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; transition: all 0.3s; border: 1.5px dashed rgba(255,255,255,0.3); }
        .circle.active { background: white; border-style: solid; border-color: var(--gold); transform: scale(1.1); box-shadow: 0 0 10px rgba(255,209,102,0.5); }
        
        .footer { display: flex; justify-content: space-between; font-size: 0.75rem; opacity: 0.9; }

        /* BACK FACE */
        .card-back { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dark); }
        .qr-placeholder { background: #fff; padding: 12px; border: 2px solid var(--primary); border-radius: 12px; margin-bottom: 10px; }
        .qr-placeholder img { display: block; filter: contrast(1.2); }
        .back-text { font-size: 0.8rem; font-weight: bold; color: var(--primary); }

        /* Controls */
        .controls { margin-top: 40px; display: flex; gap: 10px; }
        button { padding: 12px 25px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.2s; text-transform: uppercase; font-size: 0.8rem; }
        .btn-stamp { background: var(--gold); color: #444; }
        .btn-reset { background: transparent; color: #888; border: 1px solid #444; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="demo-badge">POC - Static Preview Mode</div>

    <div id="app">
        <div class="card-wrapper" @click="isFlipped = !isFlipped">
            <div class="card-inner" :class="{ 'is-flipped': isFlipped }">
                
                <div class="card-face card-front">
                    <div class="card-header">
                        <div class="brand">BRUNCH.CO</div>
                        <div class="promo-tag">VIP LOYALTY</div>
                    </div>

                    <div class="stamps-grid">
                        <div v-for="n in 10" :key="n" class="circle" :class="{ active: n <= stamps }">
                            <span v-if="n <= stamps">🍳</span>
                        </div>
                    </div>

                    <div class="footer">
                        <div>CLIENT: {{ customerName }}</div>
                        <div v-if="stamps < 10">LACKING {{ 10 - stamps }} STAMPS</div>
                        <div v-else style="color: var(--gold); font-weight: bold;">REWARD READY! 🎁</div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="qr-placeholder">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=POC_DEMO_USER" width="140" alt="QR">
                    </div>
                    <div class="back-text">SCAN TO STAMP</div>
                    <div style="font-size: 0.6rem; color: #aaa; margin-top: 5px;">Tap to flip back</div>
                </div>

            </div>
        </div>

        <div class="controls">
            <button class="btn-stamp" @click.stop="addStamp">🍳 Add Stamp</button>
            <button class="btn-reset" @click.stop="resetStamps">Reset</button>
        </div>
        
        <p style="margin-top: 20px; font-size: 0.8rem; color: #666;">Tip: Click the card to see the flip effect.</p>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const stamps = ref(3); // Start with 3 stamps for the demo
                const isFlipped = ref(false);
                const customerName = ref("JOSE SILVA");

                const addStamp = () => {
                    if (stamps.value < 10) stamps.value++;
                };

                const resetStamps = () => {
                    stamps.value = 0;
                };

                return { stamps, isFlipped, customerName, addStamp, resetStamps };
            }
        }).mount('#app');
    </script>
</body>
</html>
