<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Desk - VIP Cards</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --bg-main: #121212; --bg-card: #1e1e1e; --text-main: #ffffff; --text-sub: #888888; --border-color: #333333; }
        body { background: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-link { position: fixed; top: 20px; right: 20px; background: none; border: none; font-size: 1.4rem; opacity: 0.3; cursor: pointer; transition: 0.3s; z-index: 100; }
        .admin-link:hover { opacity: 1; transform: rotate(45deg); }
        .reg-box { background: var(--bg-card); padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border-color); }
        .tabs { display: flex; gap: 5px; margin-bottom: 25px; background: var(--bg-main); padding: 5px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tabs button { background: transparent; color: var(--text-sub); border: none; cursor: pointer; font-weight: 800; padding: 12px; flex: 1; border-radius: 8px; font-size: 0.75rem; }
        .tabs button.active { background: var(--primary); color: white; }
        input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 0.95rem; margin-bottom: 15px; box-sizing: border-box; }
        .main-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .main-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* ESTILOS NOVOS PARA RGPD */
        .consent-group { margin: 10px 0 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); text-align: left; }
        .consent-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .consent-item:last-child { margin-bottom: 0; }
        .consent-item input { width: auto; margin: 3px 0 0; }
        .consent-text { font-size: 0.7rem; color: var(--text-sub); line-height: 1.4; }
        .consent-text b { color: var(--text-main); }
        
        /* Search Results Styles */
        .results-list { background: var(--bg-main); border-radius: 12px; margin-top: 10px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); }
        .result-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; text-align: left; transition: 0.2s; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: rgba(0, 168, 150, 0.1); }
    </style>
</head>
<body>
    <div id="app" style="display: contents;">
        <button @click="goToAdmin" class="admin-link">⚙️</button>

        <div class="reg-box">
            <header style="margin-bottom: 30px;">
                <img v-if="storeConfig.logo" :src="storeConfig.logo" style="width:70px; margin-bottom:10px;">
                <h1 style="font-size: 1.4rem; margin: 0; text-transform: uppercase;">{{ storeConfig.name }}</h1>
            </header>

            <div v-if="!createdCard">
                <div class="tabs">
                    <button @click="tab = 'new'" :class="{active: tab === 'new'}">NEW REGISTER</button>
                    <button @click="tab = 'find'" :class="{active: tab === 'find'}">SEARCH</button>
                </div>

                <div v-if="tab === 'new'">
                    <input v-model="form.first_name" placeholder="First Name *">
                    <input v-model="form.last_name" placeholder="Last Name *">
                    <input v-model="form.email" placeholder="Email Address">
                    <input v-model="form.phone" placeholder="Phone Number">

                    <div class="consent-group">
                        <label class="consent-item">
                            <input type="checkbox" v-model="form.rgpd">
                            <span class="consent-text">I confirm that I have read and agree to the <b>Privacy Policy</b> and consent to the processing of my data. *</span>
                        </label>
                        <label class="consent-item" v-if="form.email">
                            <input type="checkbox" v-model="form.marketing">
                            <span class="consent-text">I would like to receive exclusive offers and news via email.</span>
                        </label>
                    </div>
                    <button class="main-btn" :disabled="!form.rgpd" @click="register">Create VIP Card</button>
                </div>

                <div v-else>
                    <input v-model="searchTerm" placeholder="Search..." @input="doSearch">
                    <div v-if="searchResults.length" class="results-list">
                        <div v-for="c in searchResults" :key="c.id" class="result-item" @click="openCard(c.id)">
                            <div style="font-weight:800;">{{ c.customer_id }} {{ c.last_name }}</div>
                            <div style="font-size:0.7rem; color:var(--text-sub);">MEMBER #{{ c.member_number }}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div v-else style="padding:20px; border:2px dashed var(--primary); border-radius:16px;">
                <h2 style="color:var(--primary);">Card Ready!</h2>
                <button class="main-btn" @click="viewCreated">OPEN CARD</button>
                <button class="main-btn" @click="createdCard = null" style="background:transparent; color:var(--text-sub); border:none;">Register another</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const tab = ref('new');
                const form = ref({ first_name: '', last_name: '', email: '', phone: '', rgpd: false, marketing: false });
                const searchTerm = ref('');
                const searchResults = ref([]);
                const createdCard = ref(null);
                const storeConfig = ref({ name: 'Brunch.co', logo: '', themeMode: 'dark' });

                const fetchSettings = async () => {
                    const res = await fetch('/api/v1/system/config');
                    if (res.ok) storeConfig.value = await res.json();
                };

                const goToAdmin = async () => {
                    const pass = prompt("Access Key:");
                    if (!pass) return;
                    
                    // VERIFICAÇÃO SEGURA NO SERVIDOR
                    const res = await fetch('/api/v1/admin/verify-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pass })
                    });

                    if (res.ok) window.location.href = "/admin";
                    else alert("Access Denied");
                };

                const register = async () => {
                    if (!form.value.rgpd) return alert("You must accept the Privacy Policy to continue.");
                    
                    const res = await fetch('/api/v1/cards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            customer_id: form.value.first_name, 
                            last_name: form.value.last_name, 
                            email: form.value.email,
                            phone: form.value.phone,
                            rgpd_accepted: form.value.rgpd,       // NOVO
                            marketing_accepted: form.value.marketing // NOVO
                        })
                    });
                    if (res.ok) createdCard.value = await res.json();
                };

                const doSearch = async () => {
                    if (searchTerm.value.length < 2) return;
                    const res = await fetch(`/api/v1/cards/search?q=${searchTerm.value}`);
                    if (res.ok) searchResults.value = await res.json();
                };

                const openCard = (id) => window.open(`/card?id=${id}&auth=staff`, '_blank');
                const viewCreated = () => window.open(`/card?id=${createdCard.value.id}&auth=staff`, '_blank');

                onMounted(fetchSettings);

                return { tab, form, searchTerm, searchResults, createdCard, storeConfig, register, doSearch, openCard, viewCreated, goToAdmin };
            }
        }).mount('#app');
    </script>
</body>
</html>
