<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunch.co - Loyalty</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { 
            --primary: #00a896; 
            --bg-main: #121212; 
            --text-main: #ffffff; 
            --text-sub: #888888; 
            --border-color: #333333;
            --gold: #ffd166;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-main); color: var(--text-main); 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* TOPO (Login Button) */
        .top-bar {
            width: 100%; padding: 20px 40px; box-sizing: border-box;
            display: flex; justify-content: flex-end; align-items: center;
            position: absolute; top: 0; left: 0; z-index: 10;
        }

        .login-trigger {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 8px 16px; border-radius: 20px;
            font-weight: 600; font-size: 0.8rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        .login-trigger:hover { background: var(--gold); color: #121212; }

        /* CENTRO (Logo & Intro) */
        .hero-center {
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            position: relative; z-index: 5;
        }
        .store-logo-hero {
            width: 100px; height: 100px; object-fit: contain;
            margin-bottom: 20px; border-radius: 50%; 
            border: 2px solid var(--border-color); padding: 10px;
            background: rgba(255,255,255,0.05); box-shadow: 0 0 30px rgba(0, 168, 150, 0.2);
        }
        .store-title {
            font-size: 2.5rem; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 4px;
            color: var(--text-main); margin-bottom: 5px;
        }
        .store-subtitle {
            color: var(--primary); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 40px; font-weight: 700;
        }

        /* ESTATÍSTICAS (Stats Row) */
        .stats-row {
            display: flex; gap: 40px; margin-bottom: 50px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: 800; color: white; display: block; }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; margin-top: 5px; }

        /* VISUAL CARD FAN (O Leque de Cartões) */
        .card-showcase {
            position: relative; width: 300px; height: 180px;
            perspective: 1000px; margin-top: 20px;
        }
        .mini-card {
            position: absolute; width: 240px; height: 150px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.5s ease; left: 30px;
            display: flex; align-items: flex-end; padding: 15px; box-sizing: border-box;
        }
        /* Design 1: Retro/Orange */
        .card-1 { background: #e67e22; transform: rotate(-10deg) translate(-40px, 10px); z-index: 1; opacity: 0.8; }
        /* Design 2: Valentine/Pink */
        .card-2 { background: #ff4d6d; transform: rotate(10deg) translate(40px, 10px); z-index: 1; opacity: 0.8; }
        /* Design 3: Default/Teal (Centro) */
        .card-3 { background: var(--primary); transform: rotate(0deg) translate(0, -10px) scale(1.1); z-index: 2; border: 2px solid var(--gold); }
        
        .card-content { font-size: 0.6rem; font-weight: bold; text-transform: uppercase; color: white; width: 100%; display: flex; justify-content: space-between; }

        /* Animação ao passar o rato */
        .card-showcase:hover .card-1 { transform: rotate(-20deg) translate(-60px, 20px); }
        .card-showcase:hover .card-2 { transform: rotate(20deg) translate(60px, 20px); }
        .card-showcase:hover .card-3 { transform: scale(1.15) translateY(-20px); box-shadow: 0 0 20px var(--primary); }

        /* MODAL DE LOGIN */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; animation: fadeIn 0.3s ease;
        }
        .login-card {
            background: #1e1e1e; padding: 40px; border-radius: 16px;
            width: 100%; max-width: 350px; border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative;
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; 
            background: none; border: none; color: var(--text-sub); 
            font-size: 1.2rem; cursor: pointer;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        input {
            width: 100%; padding: 14px; background: #121212;
            border: 1px solid var(--border-color); color: white;
            border-radius: 8px; font-size: 1rem; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--primary); }

        .btn-submit {
            width: 100%; padding: 14px; background: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-weight: 800; cursor: pointer; font-size: 0.9rem;
            text-transform: uppercase; margin-top: 10px; transition: 0.2s;
        }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .error-msg { color: #ff4444; font-size: 0.8rem; margin-top: 15px; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="app">
        <div class="top-bar">
            <button @click="showModal = true" class="login-trigger">
                🔐 Access System
            </button>
        </div>

        <div class="hero-center">
            <img v-if="storeConfig.logo" :src="storeConfig.logo" class="store-logo-hero">
            <div class="store-title">{{ storeConfig.name }}</div>
            <div class="store-subtitle">Digital Loyalty Program</div>

            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-value">{{ stats.total_cards || 0 }}</span>
                    <span class="stat-label">Clients</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">{{ stats.total_stamps || 0 }}</span>
                    <span class="stat-label">Stamps</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">{{ stats.total_redeems || 0 }}</span>
                    <span class="stat-label">Redeems</span>
                </div>
            </div>

            <div class="card-showcase">
                <div class="mini-card card-1">
                    <div class="card-content"><span>Retro</span><span>🍳 5</span></div>
                </div>
                <div class="mini-card card-2">
                    <div class="card-content"><span>Valentine</span><span>🍳 8</span></div>
                </div>
                <div class="mini-card card-3">
                    <div class="card-content"><span>{{ storeConfig.name }} VIP</span><span>🍳 10</span></div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" v-if="showModal" @click.self="showModal = false">
            <div class="login-card">
                <button class="close-btn" @click="showModal = false">✕</button>
                <h2 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: var(--primary); text-transform: uppercase;">Secure Login</h2>
                
                <form @submit.prevent="handleLogin">
                    <div class="form-group">
                        <label>Email or Username</label>
                        <input type="text" v-model="form.identifier" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" v-model="form.password">
                    </div>

                    <button type="submit" class="btn-submit" :disabled="loading">
                        {{ loading ? 'Authenticating...' : 'ENTER DASHBOARD' }}
                    </button>
                </form>

                <div v-if="errorMsg" class="error-msg">{{ errorMsg }}</div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const showModal = ref(false);
                const loading = ref(false);
                const errorMsg = ref('');
                const form = ref({ identifier: '', password: '' });
                const storeConfig = ref({ name: 'Brunch.co', logo: '' });
                const stats = ref({ total_cards: 0, total_stamps: 0, total_redeems: 0 });

                const fetchConfig = async () => {
                    try {
                        const res = await fetch('/api/v1/system/config');
                        if (res.ok) storeConfig.value = await res.json();
                    } catch (e) {}
                };

                const fetchStats = async () => {
                    try {
                        const res = await fetch('/api/v1/public/stats');
                        if (res.ok) stats.value = await res.json();
                    } catch (e) {}
                };

                const handleLogin = async () => {
                    loading.value = true;
                    errorMsg.value = '';

                    try {
                        const res = await fetch('/api/v1/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(form.value)
                        });

                        if (res.ok) {
                            const data = await res.json();
                            // Redireciona consoante a role (admin ou customer)
                            window.location.href = data.redirect;
                        } else {
                            errorMsg.value = "Invalid credentials. Please try again.";
                        }
                    } catch (e) {
                        errorMsg.value = "Connection error.";
                    } finally {
                        loading.value = false;
                    }
                };

                onMounted(() => {
                    fetchConfig();
                    fetchStats();
                });

                return { showModal, form, loading, errorMsg, storeConfig, stats, handleLogin };
            }
        }).mount('#app');
    </script>
</body>
</html>
