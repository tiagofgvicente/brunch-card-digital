<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Desk - VIP Cards</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        /* DYNAMIC THEME VARIABLES - Synchronized with Admin */
        :root { 
            --primary: #00a896; 
            --bg-main: #121212; 
            --bg-card: #1e1e1e; 
            --text-main: #ffffff;
            --text-sub: #888888;
            --border-color: #333333;
            --gold: #ffd166; 
        }

        body { 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
            transition: background 0.3s, color 0.3s;
        }

        .reg-box { 
            background: var(--bg-card); 
            padding: 40px; border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            width: 100%; max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }
        
        .store-header { margin-bottom: 30px; }
        .store-logo { width: 70px; height: 70px; object-fit: contain; margin-bottom: 12px; border-radius: 12px; background: white; padding: 5px; border: 1px solid var(--border-color); }
        .store-header h1 { font-size: 1.4rem; margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 25px; background: var(--bg-main); padding: 5px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tabs button { 
            background: transparent; color: var(--text-sub); 
            border: none; cursor: pointer; font-weight: 800; 
            padding: 12px; flex: 1; border-radius: 8px; transition: 0.2s; font-size: 0.75rem;
        }
        .tabs button.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0, 168, 150, 0.2); }

        .form-group { text-align: left; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-sub); margin-bottom: 5px; margin-left: 5px; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 14px 16px; border-radius: 10px; 
            border: 1px solid var(--border-color); 
            background: var(--bg-main); color: var(--text-main); 
            font-size: 0.95rem; box-sizing: border-box; margin-bottom: 15px; 
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); outline: none; }
        
        .main-btn { 
            width: 100%; padding: 16px; background: var(--primary); 
            color: white; border: none; border-radius: 12px; 
            font-weight: 800; cursor: pointer; font-size: 1rem; 
            transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 10px;
        }
        .main-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* Search Results */
        .results-list { background: var(--bg-main); border-radius: 12px; margin-top: 10px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); }
        .result-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; text-align: left; transition: 0.2s; }
        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: rgba(0, 168, 150, 0.1); }
        .result-name { font-weight: 800; font-size: 0.95rem; display: block; }
        .result-meta { color: var(--text-sub); font-size: 0.75rem; font-weight: 600; }

        .success-card { padding: 20px; border-radius: 16px; background: rgba(0,168,150,0.05); border: 2px dashed var(--primary); }
    </style>
</head>
<body>
    <div id="app" class="reg-box">
        <header class="store-header">
            <img v-if="storeConfig.logo" :src="storeConfig.logo" class="store-logo">
            <h1>{{ storeConfig.name }}</h1>
        </header>

        <div v-if="!createdCard">
            <div class="tabs">
                <button @click="tab = 'new'" :class="{active: tab === 'new'}">NEW REGISTER</button>
                <button @click="tab = 'find'" :class="{active: tab === 'find'}">SEARCH</button>
            </div>

            <div v-if="tab === 'new'" class="form-group">
                <label>Customer Name</label>
                <input v-model="form.first_name" placeholder="First Name *">
                <input v-model="form.last_name" placeholder="Last Name *">
                
                <label>Contact Info</label>
                <input v-model="form.email" placeholder="Email Address">
                <input v-model="form.phone" placeholder="Phone Number">
                
                <button class="main-btn" @click="register">Create VIP Card</button>
            </div>

            <div v-else>
                <label>Find existing customer</label>
                <input v-model="searchTerm" placeholder="Name, Email or Phone..." @input="doSearch">
                <div class="results-list" v-if="searchResults.length">
                    <div v-for="c in searchResults" :key="c.id" class="result-item" @click="openCard(c.id)">
                        <span class="result-name">{{ c.customer_id }} {{ c.last_name }}</span>
                        <span class="result-meta">MEMBER #{{ c.member_number }} • {{ c.phone || c.email || 'No contact' }}</span>
                    </div>
                </div>
            </div>
        </div>

        <div v-else class="success-card">
            <div style="font-size: 3rem; margin-bottom: 10px;">✨</div>
            <h2 style="margin: 0 0 20px; color: var(--primary);">Card Ready!</h2>
            <button class="main-btn" @click="viewCreated">OPEN DIGITAL CARD</button>
            <button class="main-btn" @click="createdCard = null" style="background: transparent; color: var(--text-sub); border: none; box-shadow: none; font-size: 0.8rem;">Register another</button>
        </div>

        <p style="margin-top: 30px; font-size: 0.65rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">
            VIP Loyalty System &copy; 2026
        </p>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const STAFF_KEY = "brunch2026vip"; 

        createApp({
            setup() {
                const tab = ref('new');
                const form = ref({ first_name: '', last_name: '', email: '', phone: '', nif: '' });
                const searchTerm = ref('');
                const searchResults = ref([]);
                const createdCard = ref(null);
                const storeConfig = ref({ name: 'Brunch.co', logo: '', themeMode: 'dark' });

                const applyTheme = () => {
                    const root = document.documentElement;
                    if (storeConfig.value.themeMode === 'light') {
                        root.style.setProperty('--bg-main', '#f8f9fa');      
                        root.style.setProperty('--bg-card', '#ffffff');      
                        root.style.setProperty('--text-main', '#212529');    
                        root.style.setProperty('--text-sub', '#6c757d');     
                        root.style.setProperty('--border-color', '#dee2e6'); 
                    } else {
                        root.style.setProperty('--bg-main', '#121212');
                        root.style.setProperty('--bg-card', '#1e1e1e');
                        root.style.setProperty('--text-main', '#ffffff');
                        root.style.setProperty('--text-sub', '#888888');
                        root.style.setProperty('--border-color', '#333333');
                    }
                };

                const fetchSettings = async () => {
                    const res = await fetch('/api/v1/system/config');
                    if (res.ok) {
                        storeConfig.value = await res.json();
                        applyTheme();
                    }
                };

                const register = async () => {
                    if (!form.value.first_name || !form.value.last_name) return alert("Please fill name fields");
                    const res = await fetch('/api/v1/cards', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            customer_id: form.value.first_name,
                            last_name: form.value.last_name,
                            email: form.value.email,
                            phone: form.value.phone,
                            design: 'default'
                        })
                    });
                    if (res.ok) {
                        createdCard.value = await res.json();
                        form.value = { first_name: '', last_name: '', email: '', phone: '' };
                    }
                };

                const doSearch = async () => {
                    if (searchTerm.value.length < 2) { searchResults.value = []; return; }
                    const res = await fetch(`/api/v1/cards/search?q=${encodeURIComponent(searchTerm.value)}`);
                    if (res.ok) searchResults.value = await res.json();
                };

                const openCard = (id) => { window.open(`/card?id=${id}&staff=${STAFF_KEY}`, '_blank'); };
                const viewCreated = () => { window.open(`/card?id=${createdCard.value.id}&staff=${STAFF_KEY}`, '_blank'); };

                onMounted(fetchSettings);

                return { tab, form, searchTerm, searchResults, createdCard, storeConfig, register, doSearch, openCard, viewCreated };
            }
        }).mount('#app');
    </script>
</body>
</html>
