<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunch.co - Balcão VIP</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --dark: #1a1a1a; --gold: #ffd166; --gray: #333; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .reg-box { background: #2a2a2a; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 420px; text-align: center; border-top: 5px solid var(--primary); }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #444; }
        .tabs button { background: transparent; color: #888; border: none; cursor: pointer; font-weight: bold; padding: 10px; flex: 1; }
        .tabs button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 0.8rem; color: #aaa; margin-left: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: var(--gray); color: white; font-size: 1rem; box-sizing: border-box; margin-top: 5px; }
        
        .main-btn { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .main-btn:hover { opacity: 0.9; }

        /* Search Styles */
        .results-list { background: #1e1e1e; border-radius: 8px; margin-top: 10px; max-height: 200px; overflow-y: auto; text-align: left; }
        .result-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; transition: 0.2s; }
        .result-item:hover { background: #2a2a2a; border-left: 4px solid var(--gold); }
        .result-item div { font-weight: bold; font-size: 0.95rem; }
        .result-item small { color: #888; font-size: 0.8rem; }

        .result-card { margin-top: 20px; padding: 15px; background: rgba(0,168,150,0.1); border: 1px dashed var(--primary); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="app" class="reg-box">
        <h1>Brunch.co Balcão</h1>

        <div v-if="!createdCard">
            <div class="tabs">
                <button @click="tab = 'new'" :class="{active: tab === 'new'}">NOVO REGISTO</button>
                <button @click="tab = 'find'" :class="{active: tab === 'find'}">PESQUISAR</button>
            </div>

            <div v-if="tab === 'new'">
                <div class="form-group">
                    <input v-model="form.first_name" placeholder="Nome *">
                    <input v-model="form.last_name" placeholder="Apelido *">
                    <input v-model="form.email" placeholder="Email">
                    <input v-model="form.phone" placeholder="Telemóvel">
                    <input v-model="form.nif" placeholder="NIF">
                </div>
                <button class="main-btn" @click="register">CRIAR CARTÃO DIGITAL</button>
            </div>

            <div v-else>
                <input v-model="searchTerm" placeholder="Nome, Email, Tel ou NIF..." @input="doSearch">
                
                <div class="results-list" v-if="searchResults.length">
                    <div v-for="c in searchResults" :key="c.id" class="result-item" @click="openCard(c.id)">
                        <div>{{ c.customer_id }} {{ c.last_name }}</div>
                        <small>{{ c.phone || c.email || 'No contact info' }}</small>
                    </div>
                </div>
                <div v-else-if="searchTerm.length > 1" style="margin-top:10px; font-size:0.8rem; color:#666;">
                    Nenhum cliente encontrado...
                </div>
            </div>
        </div>

        <div v-else class="result-card">
            <p>✅ Cliente Registado!</p>
            <button class="main-btn" @click="viewCreated" style="background: var(--gold); color: #333; margin-bottom:10px;">ABRIR CARTÃO</button>
            <button class="main-btn" @click="createdCard = null" style="background: transparent; border: 1px solid #666;">VOLTAR</button>
        </div>

        <a href="/admin" style="display:block; margin-top:30px; color:#666; font-size:0.75rem; text-decoration:none;">🔒 Admin Dashboard</a>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const tab = ref('new');
                const form = ref({ first_name: '', last_name: '', email: '', phone: '', nif: '' });
                const searchTerm = ref('');
                const searchResults = ref([]);
                const createdCard = ref(null);

                const register = async () => {
    // 1. Validação de campos Obrigatórios
    if (!form.value.first_name || !form.value.last_name) {
        return alert("Nome e Apelido são obrigatórios");
    }
    
    // 2. Validação de NIF (Apenas se estiver preenchido)
    if (form.value.nif && !/^[0-9]{9}$/.test(form.value.nif)) {
        return alert("O NIF deve conter exatamente 9 dígitos numéricos.");
    }

    // 3. Validação de Email (Apenas se estiver preenchido)
    if (form.value.email && !form.value.email.includes('@')) {
        return alert("Por favor, insira um email válido.");
    }

    // 4. Validação de Telefone (Apenas se estiver preenchido - só números)
    if (form.value.phone && !/^[0-9]+$/.test(form.value.phone)) {
        return alert("O telemóvel deve conter apenas números.");
    }

    try {
        const res = await fetch('/api/v1/cards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                customer_id: form.value.first_name,
                last_name: form.value.last_name,
                email: form.value.email,
                phone: form.value.phone,
                nif: form.value.nif,
                design: 'modern'
            })
        });
        
        if (res.ok) {
            createdCard.value = await res.json();
            form.value = { first_name: '', last_name: '', email: '', phone: '', nif: '' };
        } else {
            const errorMsg = await res.text();
            alert("Erro ao criar cliente: " + errorMsg);
        }
    } catch (err) {
        alert("Erro de conexão com o servidor.");
    }
};

                const doSearch = async () => {
                    if (searchTerm.value.length < 2) {
                        searchResults.value = [];
                        return;
                    }
                    const res = await fetch(`/api/v1/cards/search?q=${encodeURIComponent(searchTerm.value)}`);
                    if (res.ok) searchResults.value = await res.json();
                };

                const openCard = (id) => {
                    window.location.href = `/card?id=${id}&admin=true`;
                };

                const viewCreated = () => {
                    window.open(`/card?id=${createdCard.value.id}&admin=true`, '_blank');
                };

                return { tab, form, searchTerm, searchResults, createdCard, register, doSearch, openCard, viewCreated };
            }
        }).mount('#app');
    </script>
</body>
</html>
