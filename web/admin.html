<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brunch Admin Dashboard</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --dark: #121212; --gold: #ffd166; --red: #ff4444; }
        body { background: var(--dark); color: white; font-family: sans-serif; padding: 40px; }
        .container { max-width: 1200px; margin: auto; }
        
        h1 { border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 30px; }

        table { width: 100%; border-collapse: collapse; background: #1e1e1e; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; font-size: 0.9rem; }
        th { background: var(--primary); color: white; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        tr:hover { background: #252525; }

        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .btn-reset { background: var(--red); color: white; }
        .btn-view { background: var(--gold); color: #333; }
        .btn-edit { background: #444; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        /* Estilos do Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #2a2a2a; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; border: 1px solid var(--primary); box-shadow: 0 0 20px rgba(0,168,150,0.2); }
        .modal-content h3 { margin-top: 0; color: var(--primary); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .form-group input:focus { border-color: var(--primary); outline: none; }

        .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
        .btn-save { flex: 2; background: var(--primary); color: white; padding: 12px; font-weight: bold; }
        .btn-cancel { flex: 1; background: #666; color: white; padding: 12px; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <h1>Dashboard de Gestão</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Apelido</th>
                    <th>Email</th>
                    <th>Telemóvel</th>
                    <th>NIF</th>
                    <th>Progresso</th>
                    <th>Total Visitas</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="card in cards" :key="card.id">
                    <td style="font-weight: bold;">{{ card.customer_id }}</td>
                    <td>{{ card.last_name }}</td>
                    <td><small>{{ card.email || '-' }}</small></td>
                    <td>{{ card.phone || '-' }}</td>
                    <td>{{ card.nif || '-' }}</td>
                    <td>
                        <span :style="{color: card.stamps_count >= 10 ? '#ffd166' : 'inherit'}">
                            {{ card.stamps_count }} / 10 🍳
                        </span>
                    </td>
                    <td>{{ card.total_stamps }}</td>
                    <td>
                        <div style="display: flex;">
                            <button class="btn btn-view" @click="viewCard(card.id)">Ver</button>
                            <button class="btn btn-edit" @click="openEdit(card)">Edit</button>
                            <button class="btn btn-reset" @click="resetCard(card.id)">Reset</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div v-if="editingCard" class="modal-overlay" @click.self="closeModal">
            <div class="modal-content">
                <h3>Editar Perfil do Cliente</h3>
                
                <div class="form-group">
                    <label>NOME (FIRST NAME)</label>
                    <input v-model="editForm.customer_id" placeholder="Primeiro Nome">
                </div>

                <div class="form-group">
                    <label>APELIDO (LAST NAME)</label>
                    <input v-model="editForm.last_name" placeholder="Apelido">
                </div>

                <div class="form-group">
                    <label>EMAIL</label>
                    <input v-model="editForm.email" type="email" placeholder="email@exemplo.com">
                </div>

                <div class="form-group">
                    <label>TELEMÓVEL</label>
                    <input v-model="editForm.phone" placeholder="9xxxxxxxx">
                </div>

                <div class="form-group">
                    <label>NIF (9 DÍGITOS)</label>
                    <input v-model="editForm.nif" maxlength="9" placeholder="NIF">
                </div>

                <div class="modal-actions">
                    <button class="btn btn-save" @click="saveEdit">GUARDAR ALTERAÇÕES</button>
                    <button class="btn btn-cancel" @click="closeModal">CANCELAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const cards = ref([]);
                const editingCard = ref(false); // Usamos booleano para controlar visibilidade
                const editForm = ref({
                    id: '',
                    customer_id: '',
                    last_name: '',
                    email: '',
                    phone: '',
                    nif: ''
                });

                const fetchCards = async () => {
                    const res = await fetch('/api/v1/admin/cards');
                    if (res.status === 401) return alert("Não autorizado.");
                    cards.value = await res.json();
                };

                const resetCard = async (id) => {
                    if (confirm("Tens a certeza? Isto apagará TODO o histórico do cliente!")) {
                        await fetch(`/api/v1/admin/reset?id=${id}`, { method: 'POST' });
                        fetchCards();
                    }
                };

                const viewCard = (id) => window.open(`/card?id=${id}&admin=true`, '_blank');

                // Lógica reforçada para abrir o Modal preenchido
                const openEdit = (card) => {
                    editForm.value = {
                        id: card.id,
                        customer_id: card.customer_id || '',
                        last_name: card.last_name || '',
                        email: card.email || '',
                        phone: card.phone || '',
                        nif: card.nif || ''
                    };
                    editingCard.value = true;
                };

                const closeModal = () => {
                    editingCard.value = false;
                };

                const saveEdit = async () => {
                    // Validação simples antes de enviar
                    if (!editForm.value.customer_id || !editForm.value.last_name) {
                        return alert("Nome e Apelido são obrigatórios.");
                    }

                    const res = await fetch('/api/v1/admin/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(editForm.value)
                    });

                    if (res.ok) {
                        editingCard.value = false;
                        await fetchCards();
                        alert("Dados atualizados com sucesso!");
                    } else {
                        const errorMsg = await res.text();
                        alert("Erro ao atualizar: " + errorMsg);
                    }
                };

                onMounted(fetchCards);
                return { 
                    cards, 
                    resetCard, 
                    viewCard, 
                    editingCard, 
                    editForm, 
                    openEdit, 
                    saveEdit,
                    closeModal
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
