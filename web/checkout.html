<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Volto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; display: flex; justify-content: center; padding: 40px 20px; }
        .checkout-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 500px; border: 1px solid #e2e8f0; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
        .brand { font-weight: 900; font-size: 1.5rem; color: #0f172a; text-decoration: none; }
        .brand span { color: #2563eb; }
        .btn-back { font-size: 0.85rem; font-weight: 700; color: #64748b; text-decoration: none; transition: 0.2s; }
        .btn-back:hover { color: #2563eb; }

        .summary { background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .tier-name { text-transform: capitalize; color: #2563eb; font-weight: 900; font-size: 1.2rem; }
        .total-row { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #cbd5e1; font-weight: 900; font-size: 1.4rem; }

        h3 { font-size: 1.1rem; margin: 0 0 15px; }

        /* Placeholders para os botões do Stripe (MBWay, Multibanco, Cartão) */
        .payment-placeholder { width: 100%; padding: 15px; border-radius: 8px; border: 2px dashed #cbd5e1; background: #f8fafc; color: #64748b; font-weight: 600; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        .pay-btn { width: 100%; padding: 16px; background: #0f172a; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .pay-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); }

        .secure-badge { text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="checkout-box">
        <div class="header">
            <a href="/" class="brand">Volto<span>.</span></a>
            <a href="/" class="btn-back">← Voltar</a>
        </div>

        <div class="summary">
            <div class="summary-row">
                <span style="color: #64748b;">Plano Selecionado</span>
                <span class="tier-name" id="planName">A carregar...</span>
            </div>
            <div class="summary-row">
                <span style="color: #64748b;">Ciclo de Faturação</span>
                <span id="cycleName">A carregar...</span>
            </div>
            <div class="total-row">
                <span>Total a Pagar</span>
                <span id="totalPrice">€0.00</span>
            </div>
        </div>

        <h3>Detalhes de Pagamento</h3>
        
        <div class="payment-placeholder">
            🔒 Área Segura para o Stripe<br>
            <span style="font-size:0.75rem; font-weight:normal;">MBWay, Multibanco, Apple Pay e Cartão</span>
        </div>

        <button class="pay-btn" onclick="alert('Integração de pagamento em breve!')">Confirmar e Subscrever</button>

        <div class="secure-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            Pagamento 100% Seguro
        </div>
    </div>

    <script>
        // Lê as variáveis do URL vindas da Landing Page
        const urlParams = new URLSearchParams(window.location.search);
        const tier = urlParams.get('tier') || 'basic';
        const cycle = urlParams.get('cycle') || 'monthly';

        // Tabela de Preços no código para calcular o total
        const prices = {
            monthly: { basic: 20, lite: 30, pro: 40 },
            yearly: { basic: 180, lite: 300, pro: 360 }
        };

        const planName = tier === 'basic' ? 'Basic' : tier === 'lite' ? 'Lite' : 'Pro';
        const cycleText = cycle === 'monthly' ? 'Mensal' : 'Anual';
        const price = prices[cycle][tier];

        document.getElementById('planName').innerText = `Plano ${planName}`;
        document.getElementById('cycleName').innerText = cycleText;
        document.getElementById('totalPrice').innerText = `€${price}.00`;
    </script>
</body>
</html>
