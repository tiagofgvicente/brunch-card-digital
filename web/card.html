<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Loyalty Card</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --dark: #1a1a1a; --gold: #ffd166; --silver: #bdc3c7; --bronze: #cd7f32; --white: #ffffff; --page-bg: #1a1a1a; --tier-glow: transparent; }
        body { background: var(--page-bg); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; padding: 20px; transition: background 0.3s ease; }
        .card-wrapper { width: 350px; height: 215px; perspective: 1000px; filter: drop-shadow(0 0 15px var(--tier-glow)); transition: filter 0.5s ease; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 18px; border: 2px solid var(--gold); overflow: hidden; box-sizing: border-box; }
        .card-front { background: var(--primary); color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: background 0.5s ease; }
        .card-back { background: white; color: var(--dark); transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
        .card-back img { max-width: 130px; width: 80%; height: auto; margin-bottom: 5px; }
        .tier-badge { font-size: 0.6rem; font-weight: 900; letter-spacing: 1px; padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); text-transform: uppercase; }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .store-branding { display: flex; align-items: center; gap: 8px; }
        .store-logo-mini { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; background: white; padding: 1px; }
        .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 10px 0; }
        .circle { width: 44px; height: 44px; background: rgba(0,0,0,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,0.4); overflow: hidden; }
        .circle.active { background: white; border-style: solid; border-color: var(--gold); animation: pop 0.3s ease; }
        .stamp-img { width: 80%; height: 80%; object-fit: contain; }
        .card-footer { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .client-info { text-transform: uppercase; font-weight: bold; font-size: 0.8rem; line-height: 1.2; text-align: left; }
        .member-number-sub { display: block; font-size: 0.6rem; color: var(--gold); opacity: 0.9; margin-top: 2px; }
        .stats-row { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 0.85rem; }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .stat-item span { color: var(--gold); }
        .controls { margin-top: 30px; }
        .btn { padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; text-transform: uppercase; background: var(--gold); color: #333; box-shadow: 0 4px 15px rgba(255,209,102,0.3); }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="card-wrapper" v-if="card.id" :style="tierGlowStyle">
            <div class="card-inner" :class="{ 'is-flipped': isFlipped }" @click="isFlipped = !isFlipped">
                <div class="card-face card-front" :style="themeStyles">
                    <div class="card-top">
                        <div class="store-branding">
                            <img v-if="storeConfig.logo" :src="storeConfig.logo" class="store-logo-mini">
                            <span style="font-weight: 800; letter-spacing: 1.5px; font-size: 0.85rem;">{{ storeConfig.name.toUpperCase() }} VIP</span>
                        </div>
                        <div v-if="customerTier.name" class="tier-badge" :style="{ color: customerTier.color, borderColor: customerTier.color }">{{ customerTier.name }}</div>
                    </div>
                    <div class="stamps-grid">
                        <div v-for="n in 10" :key="n" class="circle" :class="{ active: n <= card.stamps_count }">
                            <template v-if="n <= card.stamps_count">
                                <img v-if="storeConfig.logo" :src="storeConfig.logo" class="stamp-img">
                                <span v-else style="font-size: 22px;">🍳</span>
                            </template>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="client-info">{{ card.customer_id }} {{ card.last_name }} <span class="member-number-sub">MEMBER Nº {{ card.member_number }}</span></div>
                        <div class="stats-row">
                            <div class="stat-item">🎁 <span>{{ availableRewards }}</span></div>
                            <div class="stat-item">🏆 <span>{{ card.total_redeemed_bonuses || 0 }}</span></div>
                            <div class="stat-item">🍳 <span>{{ card.total_stamps }}</span></div>
                        </div>
                    </div>
                </div>
                <div class="card-face card-back"><img :src="'/api/v1/qrcode?id=' + card.id" alt="QR Code"><p style="font-size: 0.6rem; font-weight: bold; color: var(--primary); margin: 0; letter-spacing: 1px; text-transform: uppercase;">Scan to Stamp</p></div>
            </div>
        </div>
        <div class="controls" v-if="isStaff"><button class="btn" @click.stop="addStamp">Validate Visit</button></div>
    </div>
    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const STAFF_KEY = "brunch2026vip"; 
        createApp({
            setup() {
                const card = ref({ id: null, design: 'default', total_stamps: 0, stamps_count: 0 });
                const isFlipped = ref(false);
                const cardId = new URLSearchParams(window.location.search).get('id');
                const isStaff = ref(new URLSearchParams(window.location.search).get('staff') === STAFF_KEY);
                const storeConfig = ref({ name: 'Brunch.co', logo: '', themeMode: 'dark', bronzeThreshold: 15, silverThreshold: 40, goldThreshold: 100 });

                const customerTier = computed(() => {
                    const total = card.value.total_stamps || 0;
                    const b = storeConfig.value.bronzeThreshold || 15, s = storeConfig.value.silverThreshold || 40, g = storeConfig.value.goldThreshold || 100;
                    if (total >= g) return { name: 'Gold', color: '#ffd166', glow: 'rgba(255, 209, 102, 0.6)' };
                    if (total >= s) return { name: 'Silver', color: '#bdc3c7', glow: 'rgba(189, 195, 199, 0.6)' };
                    if (total >= b) return { name: 'Bronze', color: '#cd7f32', glow: 'rgba(205, 127, 50, 0.6)' };
                    return { name: '', color: '', glow: 'transparent' };
                });

                const tierGlowStyle = computed(() => ({ '--tier-glow': customerTier.value.glow }));
                const applyTheme = () => { document.documentElement.style.setProperty('--page-bg', storeConfig.value.themeMode === 'light' ? '#f0f2f5' : '#1a1a1a'); };
                const fetchSettings = async () => {
                    const res = await fetch('/api/v1/system/config');
                    if (res.ok) { storeConfig.value = { ...storeConfig.value, ...(await res.json()) }; applyTheme(); }
                };

                const themeStyles = computed(() => {
                    const themes = { 'default': { primary: '#00a896', gold: '#ffd166' }, 'loja': { primary: '#1a1a1a', gold: '#ffd166' }, 'valentine': { primary: '#ff4d6d', gold: '#ffffff' } };
                    const active = themes[card.value.design] || themes['default'];
                    return { 'backgroundColor': active.primary, '--primary': active.primary, '--gold': active.gold };
                });

                const availableRewards = computed(() => Math.max(0, Math.floor(card.value.total_stamps / 10) - (card.value.total_redeemed_bonuses || 0)));
                const fetchCard = async () => { const res = await fetch(`/api/v1/cards/status?id=${cardId}`); if (res.ok) card.value = await res.json(); };
                const addStamp = async () => { if (isStaff.value) { await fetch(`/api/v1/cards/stamp?id=${cardId}`, { method: 'POST' }); fetchCard(); } };
                onMounted(() => { fetchCard(); fetchSettings(); });
                return { card, isFlipped, isStaff, availableRewards, addStamp, themeStyles, storeConfig, customerTier, tierGlowStyle };
            }
        }).mount('#app');
    </script>
</body>
</html>
