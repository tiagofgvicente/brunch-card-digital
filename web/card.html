<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brunch Loyalty Card</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        :root { --primary: #00a896; --bg: #f4f1ea; --dark: #333; }
        body { background: #e0e0e0; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }

        /* Card Container & Flip Logic */
        .card-wrapper { width: 350px; height: 220px; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); overflow: hidden; }

        /* FRONT: Based on your reference image */
        .card-front { background: var(--primary); color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .promo-text { font-weight: bold; font-size: 1.2rem; text-align: center; margin-bottom: 10px; }
        .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 10px; }
        .circle { width: 45px; height: 45px; background: rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid transparent; }
        .circle.active { background: white; border-color: #ffd166; animation: scaleUp 0.3s ease; }
        
        /* BACK: QR Code side */
        .card-back { background: white; transform: rotateY(180deg); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dark); }
        .qr-placeholder { padding: 10px; border: 2px solid var(--primary); border-radius: 10px; }

        @keyframes scaleUp { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
        
        .controls { margin-top: 30px; text-align: center; }
        button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <div class="card-wrapper" @click="isFlipped = !isFlipped">
            <div class="card-inner" :class="{ 'is-flipped': isFlipped }">
                
                <div class="card-face card-front">
                    <div class="promo-text">BUY 9 GET 1 FREE</div>
                    <div class="stamps-grid">
                        <div v-for="n in 10" :key="n" class="circle" :class="{ active: n <= card.stamps_count }">
                            <span v-if="n <= card.stamps_count">🍳</span>
                        </div>
                    </div>
                    <div style="font-size: 0.8rem; text-align: center; margin-top: 10px;">{{ card.customer_id }}</div>
                </div>

                <div class="card-face card-back">
                    <strong>SCAN AT COUNTER</strong>
                    <div class="qr-placeholder" v-if="card.id">
                        <img :src="'/api/v1/qrcode?id=' + card.id" width="140" alt="QR Code">
                    </div>
                    <p style="font-size: 0.7rem;">Click to flip back</p>
                </div>

            </div>
        </div>

        <div class="controls" v-if="isAdmin">
            <button @click.stop="addStamp">🍳 ADD STAMP (ADMIN)</button>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const card = ref({ stamps_count: 0, customer_id: 'Loading...', id: null });
                const isFlipped = ref(false);
                const isAdmin = ref(new URLSearchParams(window.location.search).get('admin') === 'true');
                const cardId = new URLSearchParams(window.location.search).get('id');

                const fetchCard = async () => {
                    const res = await fetch(`/api/v1/cards/status?id=${cardId}`);
                    card.value = await res.json();
                };

                const addStamp = async () => {
                    await fetch(`/api/v1/cards/stamp?id=${cardId}`, { method: 'POST' });
                    fetchCard();
                };

                onMounted(fetchCard);

                return { card, isFlipped, isAdmin, addStamp };
            }
        }).mount('#app');
    </script>
</body>
</html>
