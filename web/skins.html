<div class="skins-container">
    <div class="page-header">
        <h1>Configuração de Skins</h1>
        <p>A skin com a borda iluminada é a que os clientes vêem agora.</p>
    </div>

    <div class="skins-grid">
        <div id="skin-default" class="skin-card">
            <div class="active-badge">EM USO</div>
            <div class="skin-preview default-skin"><div class="mini-card-mock"></div></div>
            <div class="skin-body">
                <h3>Default Design</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="openPreview('default')">Preview</button>
                    <button id="btn-default" class="btn-skin-act" onclick="updateGlobalSkin('default')">ATIVAR</button>
                </div>
            </div>
        </div>

        <div id="skin-loja" class="skin-card">
            <div class="active-badge">EM USO</div>
            <div class="skin-preview loja-skin"><div class="mini-card-mock gold-border"></div></div>
            <div class="skin-body">
                <h3>LOJA (Personalizado)</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="openPreview('loja')">Preview</button>
                    <button id="btn-loja" class="btn-skin-act" onclick="updateGlobalSkin('loja')">ATIVAR</button>
                </div>
            </div>
        </div>

        <div id="skin-valentine" class="skin-card">
            <div class="active-badge">EM USO</div>
            <div class="skin-preview valentine">❤️</div>
            <div class="skin-body">
                <h3>Valentine's Edition</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="openPreview('valentine')">Preview</button>
                    <button id="btn-valentine" class="btn-skin-act" onclick="updateGlobalSkin('valentine')">ATIVAR</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .skins-grid { display: flex; gap: 20px; margin-top: 20px; }
    .skin-card { background: #1e1e1e; border-radius: 15px; border: 2px solid transparent; overflow: hidden; position: relative; width: 300px; transition: 0.3s; }
    
    /* ESTADO ATIVO (Borda iluminada e Badge) */
    .skin-card.is-active { border-color: #00a896; box-shadow: 0 0 15px rgba(0, 168, 150, 0.5); transform: translateY(-5px); }
    .skin-card .active-badge { display: none; position: absolute; top: 10px; right: 10px; background: #00a896; color: white; padding: 4px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
    .skin-card.is-active .active-badge { display: block; }

    .skin-preview { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .skin-preview.default-skin { background: #00a896; }
    .skin-preview.loja-skin { background: #111; border-bottom: 2px solid #ffd166; }
    .skin-preview.valentine { background: #ff4d6d; }
    
    .skin-body { padding: 15px; color: white; }
    .skin-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn-skin-preview, .btn-skin-act { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-skin-preview { background: #333; color: white; }
    .btn-skin-act { background: #00a896; color: white; }
    .btn-skin-act:disabled { background: #121212; color: #555; cursor: default; }
</style>
