<div class="skins-container">
    <div class="page-header">
        <h1>Card Skins</h1>
        <p>Choose the visual style for your customers' digital cards.</p>
    </div>

    <div class="skins-grid">
        <div id="skin-default" class="skin-card">
            <div class="active-badge">ACTIVE</div>
            <div class="skin-preview default-skin"><div class="mini-card-mock"></div></div>
            <div class="skin-body">
                <h3>Default Design</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="window.openPreview('default')">Preview</button>
                    <button id="btn-default" class="btn-skin-act" onclick="window.updateGlobalSkin('default')">ACTIVATE</button>
                </div>
            </div>
        </div>

        <div id="skin-black" class="skin-card">
            <div class="active-badge">ACTIVE</div>
            <div class="skin-preview black-skin"><div class="mini-card-mock gold-border"></div></div>
            <div class="skin-body">
                <h3>Black Edition</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="window.openPreview('black')">Preview</button>
                    <button id="btn-black" class="btn-skin-act" onclick="window.updateGlobalSkin('black')">ACTIVATE</button>
                </div>
            </div>
        </div>

        <div id="skin-custom" class="skin-card">
            <div class="active-badge">ACTIVE</div>
            <div class="skin-preview custom-skin" id="custom-skin-preview-box">
                <div class="mini-card-mock"></div>
            </div>
            <div class="skin-body">
                <h3>Custom Brand</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="window.openPreview('custom')">Preview</button>
                    <button id="btn-custom" class="btn-skin-act" onclick="window.updateGlobalSkin('custom')">ACTIVATE</button>
                </div>
            </div>
        </div>

        <div id="skin-valentine" class="skin-card">
            <div class="active-badge">ACTIVE</div>
            <div class="skin-preview valentine">❤️</div>
            <div class="skin-body">
                <h3>Valentine's</h3>
                <div class="skin-actions">
                    <button class="btn-skin-preview" onclick="window.openPreview('valentine')">Preview</button>
                    <button id="btn-valentine" class="btn-skin-act" onclick="window.updateGlobalSkin('valentine')">ACTIVATE</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .skins-grid { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
    .skin-card { background: var(--bg-side); border-radius: 15px; border: 2px solid var(--border-color); overflow: hidden; position: relative; width: 260px; transition: 0.3s; }
    
    .skin-card.is-active { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 168, 150, 0.4); transform: translateY(-5px); }
    .skin-card .active-badge { display: none; position: absolute; top: 10px; right: 10px; background: var(--primary); color: white; padding: 4px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; z-index: 10; }
    .skin-card.is-active .active-badge { display: block; }

    .skin-preview { height: 110px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .skin-preview.default-skin { background: #00a896; }
    .skin-preview.black-skin { background: #1a1a1a; border-bottom: 2px solid #ffd166; }
    .skin-preview.valentine { background: #ff4d6d; }
    .skin-preview.custom-skin { background: #888; /* Será substituído via JS */ }
    
    .skin-body { padding: 15px; color: var(--text-main); }
    .skin-body h3 { margin: 0; font-size: 1rem; margin-bottom: 12px; }
    .skin-actions { display: flex; gap: 8px; }
    
    .btn-skin-preview, .btn-skin-act { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.75rem; transition: 0.2s; }
    .btn-skin-preview { background: var(--border-color); color: var(--text-main); }
    .btn-skin-act { background: var(--primary); color: white; }
    .btn-skin-act:disabled { background: var(--bg-main) !important; color: var(--text-sub) !important; cursor: default; opacity: 0.6; }

    .mini-card-mock { width: 40px; height: 25px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; }
    .gold-border { border-color: #ffd166; }
</style>
