<div class="settings-container">
    <div class="page-header">
        <h1 style="color: var(--text-main);">Gestão de Sistema</h1>
        <p style="color: var(--text-sub);">Configura a identidade visual e as definições globais da tua loja.</p>
    </div>

    <div class="settings-grid">
        <div class="settings-card">
            <h3>Identidade da Loja</h3>
            <div class="form-group">
                <label>Nome da Loja</label>
                <input type="text" v-model="storeConfig.name" placeholder="Ex: Brunch Café">
            </div>
            <div class="form-group">
                <label>Logótipo (URL)</label>
                <input type="text" v-model="storeConfig.logo" placeholder="https://link-da-imagem.png">
                <div class="logo-preview" v-if="storeConfig.logo">
                    <img :src="storeConfig.logo" alt="Preview">
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h3>Tema do Dashboard</h3>
            <p style="font-size: 0.8rem; color: var(--text-sub);">Escolha como deseja visualizar este painel.</p>
            <div class="theme-options">
                <button class="theme-btn" :class="{active: storeConfig.themeMode === 'light'}" onclick="setTheme('light')">☀️ Claro</button>
                <button class="theme-btn" :class="{active: storeConfig.themeMode === 'dark'}" onclick="setTheme('dark')">🌙 Escuro</button>
                <button class="theme-btn" :class="{active: storeConfig.themeMode === 'custom'}" onclick="setTheme('custom')">🎨 Loja</button>
            </div>
            
            <div class="form-group" v-if="storeConfig.themeMode === 'custom'">
                <label>Cor de Identidade (Primária)</label>
                <input type="color" v-model="storeConfig.primaryColor" style="height: 40px; cursor: pointer;">
            </div>
        </div>
    </div>

    <div class="save-bar">
        <button class="btn-save" onclick="saveSettings()">Guardar Alterações</button>
    </div>
</div>

<style>
    .settings-container { animation: fadeIn 0.3s ease; }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
    .settings-card { background: var(--bg-side); padding: 25px; border-radius: 15px; border: 1px solid var(--border-color); }
    .settings-card h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; }
    
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 8px; color: var(--text-sub); font-weight: bold; }
    .form-group input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); box-sizing: border-box; }
    
    .theme-options { display: flex; gap: 10px; margin: 20px 0; }
    .theme-btn { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); cursor: pointer; font-weight: bold; transition: 0.2s; }
    .theme-btn.active { border-color: var(--primary); background: rgba(0, 168, 150, 0.1); color: var(--primary); }

    .logo-preview { margin-top: 15px; width: 80px; height: 80px; border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; background: white; padding: 5px; }
    .logo-preview img { width: 100%; height: 100%; object-fit: contain; }

    .save-bar { margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 25px; text-align: right; }
    .btn-save { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
