apiVersion: apps/v1
kind: Deployment
metadata:
  name: brunch-api-deployment
  labels:
    app: brunch-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brunch-api
  template:
    metadata:
      labels:
        app: brunch-api
    spec:
      containers:
      - name: brunch-api
        image: localhost/brunch-api:v1 # Image built with Podman
        imagePullPolicy: IfNotPresent # Critical for local images in Kind
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: brunch-api-service
spec:
  type: NodePort
  selector:
    app: brunch-api
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30080 # Maps to hostPort 8080 in kind-config